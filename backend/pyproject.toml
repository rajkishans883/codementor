[tool.poetry]
name = "codementor"
version = "0.1.0"
description = "AI-powered coding assistant with RAG"
authors = ["raj <rajkishan883@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# Backend
fastapi = "^0.139.0"
uvicorn = "^0.51.0"

# Authentication & Security
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = "^1.7.4"
bcrypt = "^5.0.0"

# Database
SQLAlchemy = "^2.0.51"
psycopg2-binary = "^2.9.12"
alembic = "^1.18.5"

# Configuration
python-dotenv = "^1.2.2"
pydantic-settings = "^2.0.0"

# Redis
redis = "^8.0.1"

# File Upload
python-multipart = "^0.0.32"

# LLM / RAG
langchain = "^1.3.13"
langchain-mistralai = "^1.0.0"
mistralai = "^2.6.0"
faiss-cpu = "^1.14.3"


[tool.poetry.dev-dependencies]
pytest = "^9.1.1"
black = "^26.5.1"
flake8 = "^7.3.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"